name: Validate crate

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      #- uses: giancosta86/aurora-github/actions/validate-rust-crate@crates

      - uses: giancosta86/aurora-github/actions/tag-and-release@crates
        with:
          draft-only: true
